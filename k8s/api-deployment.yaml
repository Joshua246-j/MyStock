apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-terminal
  namespace: stockrag
  labels:
    app.kubernetes.io/name: stock-terminal
    app.kubernetes.io/part-of: mystock-ai
    app.kubernetes.io/component: api-and-frontend
spec:
  # NOTE: Single replica enforced. SQLite database and local FAISS vector index
  # require single-process write access. Horizontal scaling requires migrating to
  # client-server persistence (e.g., PostgreSQL + pgvector / Qdrant).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stock-terminal
  template:
    metadata:
      labels:
        app: stock-terminal
        app.kubernetes.io/name: stock-terminal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: ensure-ollama-models
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - >-
              until ollama list >/dev/null 2>&1; do sleep 2; done;
              ollama pull "$OLLAMA_MODEL" && ollama pull "$EMBEDDING_MODEL"
          envFrom:
            - configMapRef:
                name: stockrag-config
          env:
            - name: OLLAMA_HOST
              value: "http://ollama.stockrag.svc.cluster.local:11434"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      containers:
        - name: stock-terminal
          image: joshuajomon246/stockterminal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: stockrag-config
            - secretRef:
                name: stockrag-secret
                optional: true
          volumeMounts:
            - name: app-data
              mountPath: /app/data
            - name: app-uploads
              mountPath: /app/uploads
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: stockrag-data-pvc
        - name: app-uploads
          persistentVolumeClaim:
            claimName: stockrag-uploads-pvc
