apiVersion: v1
kind: Service
metadata:
  name: stock-terminal
  namespace: stockrag
  labels:
    app.kubernetes.io/name: stock-terminal
    app.kubernetes.io/part-of: mystock-ai
spec:
  type: NodePort
  selector:
    app: stock-terminal
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
      protocol: TCP
