# Render Blueprint Specification for MyStock AI Market Terminal (Free Tier)
# Deploy via: Render Dashboard -> Blueprints -> New Blueprint Instance -> Select Repository
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: mystock-market-preview
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health/live
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MARKET_ONLY
        value: "true"
      - key: HOST
        value: "0.0.0.0"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: AUTH_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
      # Optional external providers (configured manually in Render dashboard if available)
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
